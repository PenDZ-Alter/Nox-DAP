[env:stable-nox]
; Main Configuration
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Board configuration
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.partitions = config/partitions.csv

; Build Options
build_flags = 
	-D CORE_DEBUG_LEVEL=3
	-D BOARD_HAS_PSRAM
	-D ARDUINO_ESP32S3_DEV
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; Libraries and Packages
lib_deps = 
	esphome/ESP32-audioI2S@^2.3.0
	links2004/WebSockets@^2.7.3
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	tzapu/WiFiManager@^2.0.17
